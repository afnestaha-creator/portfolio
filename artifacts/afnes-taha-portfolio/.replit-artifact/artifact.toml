kind = "web"
previewPath = "/"
title = "Afnes Taha — Portfolio"
description = "A polished personal portfolio for Afnes Taha, a full stack developer from Algeria, with real project videos, a personal portrait, project showcases, experience, skills, and contact details."
version = "1.0.0"
id = "artifacts/afnes-taha-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19337

[services.development]
run = "pnpm --filter @workspace/afnes-taha-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/afnes-taha-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/afnes-taha-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19337"
BASE_PATH = "/"
